[project]
name = "atreides"
version = "0.3.0"
description = "Aureon Asset Services — doctrine-native institutional governance framework"
authors = [{name = "Guillermo Ravelo", email = "bill@ravelostrategicsolutions.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = ["asset-services", "post-trade", "custody", "governance", "doctrine"]

dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # XSD validation of emitted ISO 20022 against the published schemas in
    # tests/fixtures/iso20022/ (AUR-CUSTODY-CASH-001 SVIII). Test-only:
    # validation runs in CI, never in the request path.
    "lxml>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["atreides*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]

# Every entry here is a deliberate house decision, recorded with its reason.
# An unexplained ignore is indistinguishable from a rule somebody switched off
# because it was inconvenient - the same distinction this framework draws
# between NOT_ASSESSED and NONE_DISCLOSED everywhere else.
ignore = [
    # Pydantic models legitimately have many fields.
    "PLR0913",
    "PLR0917",
    # Gate and model check ladders return early, once per doctrine check. The
    # ordering IS the doctrine (CASH-001 SV.B), so collapsing the returns to
    # satisfy a counter would obscure the thing the code exists to express.
    "PLR0911",
    # Same reason, branch count rather than return count. The gate grew two
    # checks when the stress-reading and funding-refusal defects were fixed,
    # and the alternative to exceeding the counter was to merge two doctrine
    # checks that say different things - which is how the funding refusal got
    # lost in the first place.
    "PLR0912",
    # Deliberate function-local imports: breaking an import cycle at the one
    # place a value is needed, and the sys.path bootstrap in tools/ which must
    # run before the package is importable. Each carries a comment saying so.
    "PLC0415",
    # Test assertions on domain quantities. Extracting "expected 3 trades" to a
    # named constant makes the assertion harder to read, not easier.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Recorded debt rather than silent passes. These predate the current test
# conventions and should be narrowed to the specific exception each one means;
# they are listed here so the gap is visible in review rather than discovered.
"tests/cockpit/test_clearing_cockpit.py" = ["B017", "N817"]
"tests/messaging/test_emit.py" = ["B017"]
"tests/rails/test_cato_f.py" = ["B017"]
"atreides/cockpit/clearing_cockpit.py" = ["N818"]
"atreides/agents/tier1/investigation_outputs.py" = ["RUF007"]
"docs/walkthrough_demo.py" = ["E731"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --cov=atreides --cov-report=term-missing"
