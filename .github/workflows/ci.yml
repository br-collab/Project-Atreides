# Continuous integration.
#
# This repository claims that a decision must be replayable by somebody who
# was not there. Until this file existed, every verification claim in it -
# test counts, coverage, strict typing - rested on one person having run the
# suite locally and said so. That is the same shape of defect the framework
# refuses everywhere else: an assertion with no independent record.
#
# Each gate below either passes for the whole repository or names exactly what
# it excludes and why. Nothing here is advisory. A check that cannot fail
# teaches a team to ignore it, which is worse than no check because an empty
# Actions tab is honest and a green one that gates nothing is not.

name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering on `branches: [main]` meant a
  # pull request based on another branch — a stacked one, say — got no checks at all:
  # not a failure and no red mark, simply nothing to see.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Installs exactly what uv.lock records. --locked fails the job if the
      # lock no longer matches pyproject.toml, so a dependency change cannot
      # land without the lock being regenerated in the same pull request.
      - name: Install from the lock
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Property tests run at the default profile here (200 examples). The deep
      # profile is on a schedule below: it takes minutes rather than seconds,
      # and a gate people wait out is a gate people skip.
      - name: pytest
        run: pytest -q

      # Measured under the floor profile: one derandomized example per
      # property test, so the coverage floors are met by example tests alone
      # and a branch only random examples reach fails here on every run, not
      # on some seeds (ORDER HYG-1, where the cato_cash.py floor passed on 3
      # of 8 seeds). The step above still runs every property test at 200
      # random examples, so no bug finding is lost.
      - name: Coverage
        run: |
          pytest -q --hypothesis-profile=floor --cov=atreides --cov-branch --cov-report=term --cov-report=json:coverage.json --cov-fail-under=95
          python scripts/check_branch_coverage.py coverage.json

      - name: Upload requirement traceability evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: traceability-${{ github.sha }}
          path: traceability.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Same lock-file install as the Tests job.
      - name: Install from the lock
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Gates the whole repository. Every rule this project deliberately does
      # not follow is listed in pyproject.toml with the reason - an
      # unexplained ignore is indistinguishable from a rule somebody switched
      # off because it was inconvenient.
      - run: ruff check .

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Same lock-file install as the Tests job.
      - name: Install from the lock
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Strict type checking covers the complete production package. A new
      # subpackage is therefore gated automatically rather than relying on a
      # manually maintained allowlist.
      - run: mypy --strict atreides

  probes:
    name: Probes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Same lock-file install as the Tests job.
      - name: Install from the lock
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Exits non-zero if any scenario raises or if a trace differs between
      # two runs of identical inputs. Byte-for-byte replay is the property the
      # whole framework is sold on, so it is checked on every push rather than
      # asserted in a README.
      - name: Pipeline probe
        run: python tools/pipeline_probe.py

      # No performance threshold is asserted. Runner hardware varies and a
      # pinned microsecond figure would fail for reasons that have nothing to
      # do with this code. This step only proves the probe still runs.
      - name: Throughput probe
        run: python tools/throughput_probe.py --iterations 200

      # NOT run with --strict, deliberately. The stress probe currently
      # reports eight findings; gating on zero would mean either deleting
      # the findings or leaving CI red forever, and both teach a team to
      # ignore the check. What IS gated is drift: tests/test_stress_probe.py
      # pins the verdict tally, so a fixed defect or a new one fails the
      # suite and has to be accounted for in review.
      - name: Stress probe
        run: python tools/stress_probe.py

  publish-agents-snapshot:
    name: Publish agent activation snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, typecheck, probes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: agents-snapshot-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish-agents-snapshot
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-advisories-snapshot:
    name: Publish customer protection advisory snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, typecheck, probes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: advisories-snapshot-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish-advisories-snapshot
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-breaks-snapshot:
    name: Publish synthetic break snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, typecheck, probes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: breaks-snapshot-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish-breaks-snapshot
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-traceability-snapshot:
    name: Publish requirement traceability snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, typecheck, probes]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: traceability-snapshot-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish-traceability-snapshot
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
