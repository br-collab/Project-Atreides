name: Publish equities self-clearing snapshot
description: Write EQ-1 synthetic equities documents to the stable public branch.

inputs:
  token:
    description: GitHub token allowed to update the generated snapshot branch
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Install from the lock
      shell: bash
      run: uv sync --locked
    - name: Build EQ-1 documents
      shell: bash
      run: uv run python -m atreides.equities.publication_writer "$RUNNER_TEMP/equities"
    - name: Publish the newest good snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        publish_dir="$RUNNER_TEMP/equities-snapshot-publication"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git ls-remote --exit-code --heads "$remote" equities-snapshot >/dev/null; then
          git clone --depth 1 --branch equities-snapshot "$remote" "$publish_dir"
        else
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --initial-branch=equities-snapshot
          git -C "$publish_dir" remote add origin "$remote"
        fi
        cp "$RUNNER_TEMP/equities/"*.json "$publish_dir/"
        git -C "$publish_dir" config user.name "github-actions[bot]"
        git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$publish_dir" add '*.json'
        if git -C "$publish_dir" diff --cached --quiet; then exit 0; fi
        git -C "$publish_dir" commit -m "Publish EQ-1 equities snapshot"
        git -C "$publish_dir" push origin HEAD:equities-snapshot
