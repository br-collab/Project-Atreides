name: Publish SIM-1 snapshot
description: Publish the newest successful synthetic simulation documents.

inputs:
  token:
    required: true
    description: GitHub token allowed to update the generated snapshot branch
  days:
    required: false
    default: "250"
  seed:
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.11"
        enable-cache: true
    - name: Install from lock
      shell: bash
      # SIM-1B drives the real L.C. package, which is deliberately confined to
      # the source-only dev extra so Atreides production installs cannot acquire it.
      run: uv sync --locked --extra dev
    - name: Build synthetic simulation documents
      shell: bash
      run: |
        set -euo pipefail
        args=(--repository-sha "atreides=${GITHUB_SHA}")
        for repository in cannae-kernel Cato-FICC-MCP L.C. aureon; do
          sha="$(git ls-remote "https://github.com/br-collab/${repository}.git" refs/heads/main | cut -f1)"
          test -n "$sha"
          args+=(--repository-sha "${repository}=${sha}")
        done
        uv run python -m tools.run_simulator --seed "${{ inputs.seed }}" --days "${{ inputs.days }}" --output "$RUNNER_TEMP/simulation" "${args[@]}"
    - name: Publish newest good snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        publish_dir="$RUNNER_TEMP/simulation-snapshot-publication"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git ls-remote --exit-code --heads "$remote" simulation-snapshot >/dev/null; then
          git clone --depth 1 --branch simulation-snapshot "$remote" "$publish_dir"
        else
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --initial-branch=simulation-snapshot
          git -C "$publish_dir" remote add origin "$remote"
        fi
        cp "$RUNNER_TEMP/simulation/"*.json "$RUNNER_TEMP/simulation/SUMMARY.md" "$publish_dir/"
        spike_source="simulator/publication/spike-2019"
        test "$(find "$spike_source" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
        rm -rf "$publish_dir/spike-2019"
        mkdir -p "$publish_dir/spike-2019"
        cp "$spike_source/"*.json "$spike_source/SUMMARY.md" "$publish_dir/spike-2019/"
        git -C "$publish_dir" config user.name "github-actions[bot]"
        git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$publish_dir" add '*.json' 'SUMMARY.md' 'spike-2019/'
        if git -C "$publish_dir" diff --cached --quiet; then exit 0; fi
        git -C "$publish_dir" commit -m "Publish SIM-1 simulation snapshot"
        git -C "$publish_dir" push origin HEAD:simulation-snapshot
