name: Publish requirement traceability snapshot
description: Publish validated full-run traceability evidence to the stable branch.

inputs:
  token:
    description: GitHub token allowed to update the generated snapshot branch
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install from the lock
      shell: bash
      run: uv sync --locked

    - name: Download the full-run evidence
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: traceability-${{ github.sha }}
        path: ${{ runner.temp }}/traceability-artifact

    - name: Validate the traceability snapshot
      shell: bash
      run: >-
        uv run python -m atreides.traceability.publication_writer
        "$RUNNER_TEMP/traceability-artifact/traceability.json"
        "$RUNNER_TEMP/traceability.json"

    - name: Publish the newest good snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        publish_dir="$RUNNER_TEMP/traceability-snapshot-publication"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        if git ls-remote --exit-code --heads "$remote" traceability-snapshot >/dev/null; then
          git clone --depth 1 --branch traceability-snapshot "$remote" "$publish_dir"
        else
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --initial-branch=traceability-snapshot
          git -C "$publish_dir" remote add origin "$remote"
        fi

        cp "$RUNNER_TEMP/traceability.json" "$publish_dir/traceability.json"
        git -C "$publish_dir" config user.name "github-actions[bot]"
        git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$publish_dir" add traceability.json
        if git -C "$publish_dir" diff --cached --quiet; then
          exit 0
        fi
        git -C "$publish_dir" commit -m "Publish requirement traceability snapshot"
        git -C "$publish_dir" push origin HEAD:traceability-snapshot
