name: Publish break snapshot
description: Write the synthetic break document to the stable publication branch.

inputs:
  token:
    description: GitHub token allowed to update the generated snapshot branch
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install from the lock
      shell: bash
      run: uv sync --locked

    - name: Write the break snapshot
      shell: bash
      run: >-
        uv run python -m atreides.cockpit.breaks_publication_writer
        "$RUNNER_TEMP/breaks.json"

    - name: Publish the newest good snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        publish_dir="$RUNNER_TEMP/breaks-snapshot-publication"
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        if git ls-remote --exit-code --heads "$remote" breaks-snapshot >/dev/null; then
          git clone --depth 1 --branch breaks-snapshot "$remote" "$publish_dir"
        else
          mkdir -p "$publish_dir"
          git -C "$publish_dir" init --initial-branch=breaks-snapshot
          git -C "$publish_dir" remote add origin "$remote"
        fi

        cp "$RUNNER_TEMP/breaks.json" "$publish_dir/breaks.json"
        git -C "$publish_dir" config user.name "github-actions[bot]"
        git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C "$publish_dir" add breaks.json
        if git -C "$publish_dir" diff --cached --quiet; then
          exit 0
        fi
        git -C "$publish_dir" commit -m "Publish synthetic break snapshot"
        git -C "$publish_dir" push origin HEAD:breaks-snapshot
